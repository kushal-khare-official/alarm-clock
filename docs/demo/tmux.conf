# tmux settings for the recorded demo only (see demo.tape). Isolated from any user config:
# the tape starts tmux with `-f docs/demo/tmux.conf -L alarmdemo`.
set -g default-terminal "tmux-256color"
set -g default-command "bash --norc --noprofile"   # panes inherit the tape's env and PS1
set -g status off
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g escape-time 0
set -g mouse off
set -g allow-rename off
